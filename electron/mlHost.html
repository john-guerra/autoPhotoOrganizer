<!doctype html>
<meta charset="utf-8" />
<title>AutoGallery ML host</title>
<!--
  Import map for the bare specifiers `mlHost.js` (and, transitively,
  transformers.js's own browser bundle) uses. This page loads with
  nodeIntegration disabled, so `<script type="module">` resolution is
  Chromium's plain browser ES module loader — it has no node_modules
  resolution algorithm and cannot see a bare "@huggingface/transformers"
  specifier at all. An import map is the standard fix and keeps everything
  local: transformers.js's own dist/transformers.web.js browser bundle has
  exactly two further bare imports of its own (checked against the installed
  4.2.0 package — see task-11-report.md), both mapped below, so nothing here
  reaches out to a CDN. The whole point of running WebGPU in-process is to
  avoid a network dependency for the RUNTIME; only the model WEIGHTS should
  ever need the network, same as the ONNX host.
-->
<script type="importmap">
  {
    "imports": {
      "@huggingface/transformers": "../node_modules/@huggingface/transformers/dist/transformers.web.js",
      "onnxruntime-web/webgpu": "../node_modules/onnxruntime-web/dist/ort.webgpu.bundle.min.mjs",
      "onnxruntime-common": "../node_modules/onnxruntime-common/dist/esm/index.js"
    }
  }
</script>
<body>
  <script type="module" src="./mlHost.js"></script>
</body>
