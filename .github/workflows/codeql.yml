name: CodeQL

# Static security analysis (code scanning) for the JS/Svelte sources. Runs on
# every push/PR to `testing` (the trunk) and `main` (the release line), and
# weekly, so a newly-introduced injection or unsafe path pattern surfaces as a
# GitHub code-scanning alert rather than reaching a release. Complements the
# runtime guardrails (safeResolve, Electron hardening) and the npm-audit
# supply-chain gate in ci.yml.

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  schedule:
    - cron: "27 3 * * 1"

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
