name: Release

# Cut a release by pushing a version tag:
#   npm version 2.0.0-alpha.1 && git push origin main --follow-tags
# Each OS runner builds its native installers and electron-builder's
# `--publish always` uploads them + the update metadata (latest*.yml) to the
# tag's GitHub Release; installed apps read that metadata via electron-updater.
#
# NOTE: macOS auto-update needs a SIGNED + notarized build. Until Developer ID
# secrets are added below, mac artifacts install fine but won't auto-update;
# Windows/Linux auto-update works from these unsigned builds.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Publish the OS legs ONE AT A TIME. Each leg runs `electron-builder
      # --publish always` against the SAME draft release; run in parallel, a
      # later leg's release update races and drops assets an earlier leg already
      # uploaded (v2.17.0's first build shipped with no Linux AppImage and no
      # mac update .zip, both uploaded then clobbered). Serialized, each leg
      # publishes to a settled release. Slower, but the release is complete.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            flag: --mac
          - os: windows-latest
            flag: --win
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - run: npm ci
      - run: npm run build
      # Rebuild native modules (better-sqlite3) for Electron's ABI — each runner
      # does this for its own OS. electron-builder's built-in rebuild is a no-op
      # here, which shipped a Node-ABI binary and crashed the app on launch
      # (#67), so force it and skip electron-builder's own rebuild via the
      # `npmRebuild: false` build config (an inline `-c.npmRebuild=false` CLI
      # arg mis-parsed on the Windows runner as a bogus config-file path and
      # failed every Windows build).
      - run: npx electron-rebuild -f -w better-sqlite3
      - run: npx electron-builder ${{ matrix.flag }} --publish always
        env:
          # WHO THE RELEASE IS BY. GitHub credits a release to whoever's token
          # created it, and it can't be reassigned afterwards — with the default
          # GITHUB_TOKEN every release reads "github-actions[bot]". Add a personal
          # access token (repo scope) as the RELEASE_TOKEN secret and releases are
          # authored by John instead. Falls back to the built-in token so a fork
          # without the secret still builds.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # No Developer ID certs in CI — keep the mac build from stalling on
          # signing. The build still gets an AD-HOC signature (see
          # build/adhoc-sign.cjs): the bundle is sealed and runs on Apple
          # Silicon, but Gatekeeper can't authenticate the author, so a first
          # launch needs right-click → Open and macOS auto-update stays off.
          # Both are fixed by adding Developer ID secrets here.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
