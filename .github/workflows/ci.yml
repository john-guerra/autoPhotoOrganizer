name: CI

# Fast checks on every push and PR to the two long-lived branches: the test
# suite, a Prettier format
# gate (keeps the #76 baseline clean — a stray unformatted file fails here
# rather than drifting the tree back to "only format your own files"), a
# production build, and the browser tier.
#
# The e2e job is not decoration. The vitest suite covers PURE modules, so it
# stayed green through every one of the 2.9.x bugs that reached a user — they
# were all click-level, DOM-level or load-order bugs, which pure-function tests
# structurally cannot catch. The Playwright specs exist for exactly that, and a
# suite that only runs when someone remembers to run it is a suite that is green
# for the wrong reason. It runs as its own job so a slow browser run never
# delays the fast unit feedback.
#
# The heavier native/electron packaging lives in release.yml (tag-triggered).
#
# `testing` is the trunk every feature PR targets and `main` is the release
# line, so BOTH need the gate. Listing only `main` — as this file did until the
# split — means a PR into `testing` runs no checks at all and reports itself
# mergeable, which is worse than having no CI: it looks green.

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

# Cancel a PR run that a newer push has superseded — but NEVER cancel the
# post-merge run on `testing`. That run is the record that trunk is green, and
# it is the only thing that catches two individually-green PRs going red once
# they are in one tree (#212: 36 tests red, across files neither PR had heard
# of). Hence the condition: this is not boilerplate that can be simplified to a
# bare `true`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Supply-chain backstop (slopsquatting / known-CVE): fail on a high or
      # critical advisory in the PRODUCTION dependency tree. Dev-only tooling
      # advisories don't ship in the Electron bundle (build.files is server/ +
      # electron/ + dist/ only), so --omit=dev keeps the gate about what users
      # actually run. Dependabot handles the routine bumps; this catches the ones
      # that land between its runs.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm test
      # A build failure is a shipped-app failure: vitest imports modules
      # directly and never compiles a Svelte template, so a broken import or a
      # bad binding can pass the unit suite and still die in the packaged app.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # The browser binary is ~130MB and was re-downloaded on every single run.
      # Keyed on the lockfile, since that is what pins the Playwright version —
      # a key that ignored it would serve a cached browser to a bumped client.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Chromium only — the app ships inside Electron, which is Chromium.
      # `--with-deps` still runs on a cache hit: the system libraries it
      # installs live outside the cached path.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # A red e2e run is worth nothing if you can't see WHAT the page looked
      # like: the config already keeps a trace and a screenshot on failure.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
