name: CI

# Fast checks on every push and PR to main: the test suite plus a Prettier
# format gate (keeps the #76 baseline clean — a stray unformatted file fails
# here rather than drifting the tree back to "only format your own files").
# The heavier native/electron packaging lives in release.yml (tag-triggered).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
